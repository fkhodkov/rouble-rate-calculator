name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test and package CLI
        run: mvn --batch-mode --no-transfer-progress verify

  native:
    name: Native CLI (GraalVM 25)
    runs-on: ubuntu-latest
    needs: cli
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: true
      - name: Build native executable
        run: mvn --batch-mode --no-transfer-progress -Pnative package -DskipTests
      - name: Smoke-test both languages
        run: |
          ./rate-cli/target/rouble-rate-calculator --language en --help
          ./rate-cli/target/rouble-rate-calculator --language ru --help | grep 'Расчёт среднего'
      - uses: actions/upload-artifact@v6
        with:
          name: rouble-rate-calculator-linux-x86_64
          path: rate-cli/target/rouble-rate-calculator
          if-no-files-found: error

  android:
    name: Android tests and APK (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and assemble Android app
        run: ./gradlew --no-daemon test assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
