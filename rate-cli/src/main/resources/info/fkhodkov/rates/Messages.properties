usage.description=Calculate average official Bank of Russia exchange rates.
currency=ISO currency code (default: ${DEFAULT-VALUE}).
startDate=Inclusive start date for an explicit interval.
endDate=Inclusive end date (default: yesterday in Moscow).
periods=Comma-separated periods using d, w, m, or y (default: ${DEFAULT-VALUE}).
today=Show only the currently effective CBR rate.
language=Output language: en or ru (default: system language, falling back to English).
help=Show this help message and exit.
version=Print version information and exit.
error.prefix=Error: {0}
error.interrupted=Interrupted by user
error.calculate=Could not calculate rates: {0}
error.todayCombination=--today cannot be combined with date or period options.
error.intervalCombination=--start-date, --end-date, and --periods cannot be used together.
error.singlePeriod=Exactly one period is required when --start-date is used.
error.currency=currency must be a three-letter ISO code, such as USD
error.period=period must be a positive number followed by d, w, m, or y: {0}
average.heading=Official CBR {0}/RUB averages through {1}
average.explanation=(arithmetic mean of published rates, RUB per 1 currency unit)
average.noData={0}: no data
average.data={0}: {1} ({2}, {3} to {4})
current=Official CBR {0}/RUB rate effective {1}: {2} RUB per 1 {0}
interval=Official CBR {0}/RUB average from {1} to {2}: {3}
interval.details=({0}, {1} to {2}; RUB per 1 {3})
observations.one={0} published rate
observations.other={0} published rates
